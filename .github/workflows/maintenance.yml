name: Scheduled Maintenance

on:
  schedule:
    # Runs every 2 days at 00:00 UTC (every 48 hours)
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run maintenance checks
        run: |
          echo "Running scheduled maintenance..."
          echo "Checking dependencies for updates..."
          npm outdated || true
          echo "Checking for security vulnerabilities..."
          npm audit --audit-level=moderate || true
          echo "Maintenance checks complete"

      - name: Build verification
        run: npm run build
        env:
          VITE_XAI_API_KEY: ${{ secrets.VITE_XAI_API_KEY }}

      - name: Maintenance summary
        run: |
          echo "✅ Maintenance completed successfully"
          echo "📦 Dependencies checked"
          echo "🔒 Security audit performed"
          echo "🏗️ Build verification passed"
